<text x="30.0" y="820.0" fill="#DCE7EE" font-size="13" text-anchor="start" style="font-family:'Share Tech Mono',Menlo,Consolas,monospace" >THE ARENA · battle core, round clock,</text>
<text x="30.0" y="838.0" fill="#587080" font-size="13" text-anchor="start" style="font-family:'Share Tech Mono',Menlo,Consolas,monospace" >stadium tiers with members online</text>
<text x="30.0" y="660.0" fill="#DCE7EE" font-size="13" text-anchor="start" style="font-family:'Share Tech Mono',Menlo,Consolas,monospace" >STREAM WALLS · lower inner faces,</text>
<text x="30.0" y="678.0" fill="#587080" font-size="13" text-anchor="start" style="font-family:'Share Tech Mono',Menlo,Consolas,monospace" >spotlight screen over the core</text>
<text x="30.0" y="560.0" fill="#DCE7EE" font-size="13" text-anchor="start" style="font-family:'Share Tech Mono',Menlo,Consolas,monospace" >TURN 1 · hubs: caller booths,</text>
<text x="30.0" y="578.0" fill="#587080" font-size="13" text-anchor="start" style="font-family:'Share Tech Mono',Menlo,Consolas,monospace" >bot pods, script screens</text>
<text x="30.0" y="405.0" fill="#DCE7EE" font-size="13" text-anchor="start" style="font-family:'Share Tech Mono',Menlo,Consolas,monospace" >TURN 2 · the Sector Ring:</text>
<text x="30.0" y="423.0" fill="#587080" font-size="13" text-anchor="start" style="font-family:'Share Tech Mono',Menlo,Consolas,monospace" >every entrant, never ranked</text>
<text x="30.0" y="285.0" fill="#DCE7EE" font-size="13" text-anchor="start" style="font-family:'Share Tech Mono',Menlo,Consolas,monospace" >TURN 3 · the approach,</text>
<text x="30.0" y="303.0" fill="#587080" font-size="13" text-anchor="start" style="font-family:'Share Tech Mono',Menlo,Consolas,monospace" >kinetic words, community lights</text>
<text x="30.0" y="224.0" fill="#DCE7EE" font-size="13" text-anchor="start" style="font-family:'Share Tech Mono',Menlo,Consolas,monospace" >THE TRADE FLOOR · community · ad-free</text>
<text x="30.0" y="242.0" fill="#587080" font-size="13" text-anchor="start" style="font-family:'Share Tech Mono',Menlo,Consolas,monospace" >glass floor looking down to the Arena</text>
<text x="30.0" y="150.0" fill="#FFD27A" font-size="13" text-anchor="start" style="font-family:'Share Tech Mono',Menlo,Consolas,monospace" >GOLDEN CROWN · the peak</text>
<text x="1080.0" y="754.0" fill="#DCE7EE" font-size="13" text-anchor="end" style="font-family:'Share Tech Mono',Menlo,Consolas,monospace" >THE PORTAL · the astronaut</text>
<text x="1080.0" y="772.0" fill="#587080" font-size="13" text-anchor="end" style="font-family:'Share Tech Mono',Menlo,Consolas,monospace" >flies through the ring of light</text>
<text x="1080.0" y="395.0" fill="#FFB547" font-size="13" text-anchor="end" style="font-family:'Share Tech Mono',Menlo,Consolas,monospace" >OUTSIDE FACE · main billboard</text>
<text x="1080.0" y="413.0" fill="#587080" font-size="13" text-anchor="end" style="font-family:'Share Tech Mono',Menlo,Consolas,monospace" >only the face in view plays, muted</text>
<text x="550.0" y="900.0" fill="#cfe6ff" font-size="13" text-anchor="middle" style="font-family:'Share Tech Mono',Menlo,Consolas,monospace" >LIGHT COLUMN · the lift between every level</text>
<text x="550.0" y="922.0" fill="#FFB547" font-size="12" text-anchor="middle" style="font-family:'Share Tech Mono',Menlo,Consolas,monospace" >AD spots inside: one billboard per turn, the Arena screen between rounds only</text>
