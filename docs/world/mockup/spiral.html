const scene = new THREE.Scene(); const BG = new THREE.Color("#05080C");

let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

const dotTex = (() => { const c = document.createElement("canvas"); c.width = c.height = 64; const g = c.getContext("2d"); const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, "rgba(255,255,255,1)"); gr.addColorStop(.25, "rgba(255,255,255,.6)"); gr.addColorStop(1, "rgba(255,255,255,0)"); g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c); })();

// floor of light: the flower of life
{
  const pts = [], r = 2.2, seg = 40;

// pyramid edges
const edges = [["callers", "bots"], ["bots", "scripts"], ["scripts", "callers"], ["peak", "callers"], ["peak", "bots"], ["peak", "scripts"]];
for (const [a, b] of edges) {

}
for (const k of KINDS) { glow(C[k], 3.2, V[k], .7); glow(C[k], 1.1, V[k]); }
glow(new THREE.Color("#CFE6FF"), 2.4, V.peak, .8);
// glass faces
const face = (A, B, P, color, op) => { const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.Float32BufferAttribute([...A.toArray(), ...B.toArray(), ...P.toArray()], 3)); scene.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide, transparent: true, opacity: op, depthWrite: false }))); };
face(V.bots, V.scripts, V.peak, "#0c1a2c", .22); face(V.scripts, V.callers, V.peak, "#1a1030", .22); face(V.callers, V.bots, V.peak, "#0c1a2c", .22);

// ---- the triangular spiral ----
const RAMP0 = 1.0, TRADE = PH * 0.62, TURNS = 3, RUNS = TURNS * 3;
const INSET = 0.5;   // how far in from the walls the ramp runs
function cornerAt(i, y) { const k = (1 - y / PH) * INSET; const c = V[KINDS[i % 3]]; return new THREE.Vector3(c.x * k, y, c.z * k); }

      box.position.copy(P).add(new THREE.Vector3(0, .4, 0)); box.lookAt(0, box.position.y, 0); scene.add(box);
      const fig = glow(col, .35, P.clone().add(new THREE.Vector3(0, .55, 0)), .9); const body = glow(col, .5, P.clone().add(new THREE.Vector3(0, .32, 0)), .5);

// the Arena on the floor
const arena = { ents: [] };
{
  for (let i = 0; i < 96; i++) {
    const a = i / 96 * Math.PI * 2, m = new THREE.Mesh(new THREE.BoxGeometry(.05, .02, .38), new THREE.MeshBasicMaterial({ color: (rnd() < .53 ? C.up : C.dn).clone().multiplyScalar(1.3), toneMapped: false }));

  const col = new THREE.Mesh(new THREE.CylinderGeometry(.05, .1, TRADE - .7, 12, 1, true), new THREE.MeshBasicMaterial({ color: "#9fd0ff", transparent: true, opacity: .55, blending: add, toneMapped: false }));
  col.position.set(0, .7 + (TRADE - .7) / 2, 0); scene.add(col); arena.col = col;
  [["bots"], ["callers"], ["scripts"], ["bots"], ["callers"], ["scripts"]].forEach(([k], i) => arena.ents.push({ k, a0: i / 6 * Math.PI * 2, s: glow(C[k], .5, new THREE.Vector3()) }));

  for (let tier = 0; tier < 3; tier++) for (let i = 0; i < 60; i++) { const a = i / 60 * Math.PI * 2, r = 3.7 + tier * .35; if (rnd() < .55) glow(new THREE.Color("#cfe6ff"), .12, new THREE.Vector3(Math.cos(a) * r, .1 + tier * .18, Math.sin(a) * r), .8); }

// stream walls: screens on the lower inner faces, one colour per kind
const streamCv = document.createElement("canvas"); streamCv.width = 256; streamCv.height = 144; const streamTex = new THREE.CanvasTexture(streamCv); streamTex.colorSpace = THREE.SRGBColorSpace;
function drawStream(t) { const g = streamCv.getContext("2d"); g.fillStyle = "#0b1726"; g.fillRect(0, 0, 256, 144); g.fillStyle = "rgba(77,163,255,.25)"; for (let i = 0; i < 6; i++) g.fillRect(20 + i * 38, 100 - (Math.sin(t * 2 + i) * .5 + .5) * 60, 22, 200); g.fillStyle = "#FF4D6A"; g.font = "16px monospace"; g.fillText("● LIVE", 12, 22); g.fillStyle = "#fff"; g.beginPath(); g.moveTo(118, 58); g.lineTo(118, 88); g.lineTo(142, 73); g.fill(); streamTex.needsUpdate = true; }
for (const [a, b, ka] of [["callers", "bots", "callers"], ["bots", "scripts", "bots"], ["scripts", "callers", "scripts"]]) {

    const p = V[a].clone().lerp(V[b], .3 + j * .2).multiplyScalar(k * .93); p.y = y;

}
// the Trade Floor and the golden crown

  face(ring[0], ring[1], ring[2], "#5aa9ff", .12);
  scene.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(ring), lineMat("#cfe6ff", .9)));

  for (let i = 0; i <= 12; i++) { const a = i / 12 * Math.PI * 2, r = i % 2 ? .45 : 1.0; pts.push(new THREE.Vector3(Math.cos(a) * r, 0, Math.sin(a) * r)); }

  const tri = KINDS.map(n => new THREE.Vector3(Math.cos(ANG[n] * Math.PI / 180) * .8, 0, Math.sin(ANG[n] * Math.PI / 180) * .8));
  crown.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(tri), lineMat(C.gold, .9)));
  crown.position.set(0, TRADE + 2.2, 0); scene.add(crown); arena.crown = crown;
  glow(C.gold, 2.2, crown.position, .5);
  for (const n of KINDS) { const m = new THREE.Mesh(new THREE.PlaneGeometry(.9, .5), new THREE.MeshBasicMaterial({ map: streamTex, transparent: true, side: THREE.DoubleSide })); const p = at(ANG[n] + 180, .95, TRADE + .55); m.position.copy(p); m.lookAt(0, p.y, 0); scene.add(m); }
}

// ---- camera ----
const ease = x => x * x * (3 - 2 * x);
const DUR = 25;
const T_IN = [4.0, 7.5], T_RAMP = [7.5, 18.0], T_TOP = 18.0, T_OUT = 20.5;

// ---- overlays ----
const $ = id => document.getElementById(id);

{
